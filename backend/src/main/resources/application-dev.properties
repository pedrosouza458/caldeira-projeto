# ── Datasource ──────────────────────
spring.datasource.url=jdbc:postgresql://db.<SEU-PROJETO-DEV>.supabase.co:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=<SUA-SENHA-DEV>

# Pool de conexoes (HikariCP)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# ── JPA / Hibernate ───────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── Supabase Auth ───────────────────────────────
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://<SEU-PROJETO-DEV>.supabase.co/auth/v1
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://<SEU-PROJETO-DEV>.supabase.co/auth/v1/keys

# ── Servidor ──────────────────────────────────────────────────
server.port=8080

# ── Actuator ───────────────────────────
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# ── Springdoc / Swagger UI ────────────────────────────────────
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs

# ── Logging ──────────────────────────────────
logging.level.root=INFO
logging.level.com.project=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG