# ── Aplicacao ─────────────────────────────────────────────────
spring.application.name=projeto
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# ── Datasource (Supabase PostgreSQL) ──────────────────────────
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexoes (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── JPA / Hibernate ───────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ── Supabase Auth — OAuth2 Resource Server (JWT) ──────────────
# issuer-uri  : https://<ref>.supabase.co/auth/v1
# jwk-set-uri : https://<ref>.supabase.co/auth/v1/keys
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_JWT_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWK_SET_URI}

# ── Servidor ──────────────────────────────────────────────────
server.port=${PORT:8080}
server.servlet.context-path=/
server.shutdown=graceful

# ── Actuator ──────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

# ── Springdoc / Swagger ───────────────────────────────────────
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# ── Logging ───────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.project=INFO
logging.level.org.springframework.security=WARN